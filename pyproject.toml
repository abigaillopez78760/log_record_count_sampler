[project]
name = "log-record-count-sampler"
version = "0.1.0"
description = "Outputs a record every N occurrences of the same message, keeping a count."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
